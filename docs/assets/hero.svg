<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">lazy-commit — 提交信息，少想一步。</title>
  <desc id="description">AI 根据 Git 改动生成提交信息，你预览并确认。支持一键安装和引导配置。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111e25"/>
      <stop offset="1" stop-color="#102e2b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#87e0ba" stop-opacity="0"/>
      <stop offset=".5" stop-color="#87e0ba" stop-opacity=".4"/>
      <stop offset="1" stop-color="#87e0ba" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="358" rx="23" fill="none" stroke="#31443f"/>
  <path d="M650 0v360M0 304h1280" stroke="#ffffff" stroke-opacity=".04"/>
  <path d="M44 303h1192" stroke="url(#line)"/>

  <g font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <rect x="52" y="44" width="36" height="36" rx="11" fill="#a4edc5"/>
    <path d="m62 55 6 7-6 7m11 0h5" fill="none" stroke="#10261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="101" y="68" font-size="13" font-weight="600" letter-spacing="2.2" fill="#a4bdb3">LESS TYPING. BETTER COMMITS.</text>
    <text x="48" y="157" font-size="73" font-weight="750" letter-spacing="-3" fill="#f3f8f2">lazy-commit<tspan fill="#a4edc5">_</tspan></text>
    <text x="53" y="207" font-size="30" font-weight="500" fill="#d9e7df">提交信息，少想一步。</text>
    <text x="54" y="252" font-size="17" fill="#94ada3">AI 读懂改动，你来确认提交。</text>

    <g font-size="14" fill="#b5c9bf">
      <circle cx="61" cy="331" r="3" fill="#a4edc5"/>
      <text x="73" y="336">一键安装</text>
      <circle cx="190" cy="331" r="3" fill="#a4edc5"/>
      <text x="202" y="336">引导配置</text>
      <circle cx="319" cy="331" r="3" fill="#a4edc5"/>
      <text x="331" y="336">跨平台使用</text>
    </g>
    <text x="1230" y="336" text-anchor="end" font-size="12" letter-spacing="1.2" fill="#819e91">GIT + AI / YOU'RE IN CONTROL</text>
  </g>

  <g transform="translate(693 40)">
    <rect x="0" y="7" width="535" height="240" rx="16" fill="#000" opacity=".17"/>
    <rect width="535" height="240" rx="16" fill="#0d191e" stroke="#375049"/>
    <path d="M1 43h533" stroke="#263a34"/>
    <circle cx="21" cy="22" r="4" fill="#d6a28a"/>
    <circle cx="37" cy="22" r="4" fill="#dfce9f"/>
    <circle cx="53" cy="22" r="4" fill="#88bfa0"/>
    <text x="515" y="27" text-anchor="end" fill="#758e82" font-family="sans-serif" font-size="11" letter-spacing="1.3">WORKFLOW PREVIEW</text>
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
      <text x="25" y="82" font-size="17" fill="#dbe9de"><tspan fill="#a4edc5">$</tspan><tspan dx="8">lazy-commit</tspan></text>
      <rect x="25" y="103" width="485" height="63" rx="9" fill="#152a25"/>
      <text x="41" y="127" font-size="11" letter-spacing="1.4" fill="#8aa897">COMMIT MESSAGE</text>
      <text x="41" y="151" font-size="16" fill="#c1f0d5"><tspan fill="#f0c59b">feat</tspan>(setup): add guided configuration</text>
      <text x="26" y="207" font-size="14" fill="#829b8c">changes <tspan fill="#a4edc5">→</tspan> preview <tspan fill="#a4edc5">→</tspan> your confirmation</text>
    </g>
  </g>
</svg>
