name: Cross-platform checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: lazy-commit --version
      - run: python -m lazy_commit --lang zh-CN --help
      - run: lazy-commit --check-i18n
      - run: python -c "import curses"

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel with Unix bootstrap
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh scripts/install.sh "$PWD"/dist/*.whl
          sh scripts/install.sh "$PWD"/dist/*.whl
      - name: Install wheel with Windows bootstrap
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          & ./scripts/install.ps1 -Source $wheel
          & ./scripts/install.ps1 -Source $wheel
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: distributions
          path: dist/*
